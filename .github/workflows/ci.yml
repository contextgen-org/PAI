name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - Feng

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pai_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pai_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAI_TEST_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/pai_contract_test
      PAI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.13.1 --activate
      - run: pnpm verify:toolchain
      - run: pnpm install --frozen-lockfile
      - name: Checkout locked PAI infrastructure migrations
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: contextgen-org/PAI-infra
          ref: bb3f0a4d2543a1e2ee3e5e31ae401e07776cc134
          path: locked-infra
          persist-credentials: false
      - name: Install locked infrastructure dependencies
        working-directory: locked-infra
        run: pnpm --ignore-workspace install --frozen-lockfile
      - name: Apply locked PAI database migrations
        working-directory: locked-infra
        env:
          PAI_DATABASE_URL: ${{ env.PAI_TEST_DATABASE_URL }}
          PAI_DEPLOYMENT_ENVIRONMENT: local
          PAI_SEED_MODE: none
        run: pnpm --ignore-workspace db:fresh
      - name: Apply locked Redis effective configuration
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendonly yes
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendfsync everysec
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET maxmemory 268435456
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET maxmemory-policy noeviction
      - run: pnpm check

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - Feng

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.13.1 --activate
      - run: pnpm verify:toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

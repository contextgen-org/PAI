name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - Feng

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pai_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pai_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAI_TEST_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/pai_contract_test
      PAI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.13.1 --activate
      - run: pnpm verify:toolchain
      - run: pnpm install --frozen-lockfile
      - name: Apply locked Redis effective configuration
        run: |
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendonly yes
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET appendfsync everysec
          docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET maxmemory-policy noeviction
      - run: pnpm check

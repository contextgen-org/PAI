{
  "openapi": "3.1.0",
  "info": {
    "title": "PAI Skill Registry Internal API",
    "version": "1.0.0"
  },
  "paths": {
    "/internal/skill-registry/resolve": {
      "post": {
        "operationId": "resolveSkillsV1",
        "security": [
          {
            "PaiWorkloadJwt": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$id": "urn:pai:skill-registry:resolve-request:v1",
                "additionalProperties": false,
                "type": "object",
                "required": [
                  "schema_version",
                  "runtime_run_id",
                  "start_attempt_no",
                  "workspace_id",
                  "bot_id",
                  "deployment_environment",
                  "release_channel",
                  "owner_agent_id",
                  "expected_catalog_version",
                  "catalog_as_of",
                  "policy_input_ref",
                  "policy_input_hash",
                  "skills",
                  "idempotency_key",
                  "trace_id"
                ],
                "properties": {
                  "schema_version": {
                    "const": "skill_resolution_request.v1",
                    "type": "string"
                  },
                  "runtime_run_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "start_attempt_no": {
                    "minimum": 1,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "workspace_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "bot_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "deployment_environment": {
                    "$id": "urn:pai:shared:deployment-environment:v1",
                    "anyOf": [
                      {
                        "const": "local",
                        "type": "string"
                      },
                      {
                        "const": "dev",
                        "type": "string"
                      },
                      {
                        "const": "staging",
                        "type": "string"
                      },
                      {
                        "const": "prod",
                        "type": "string"
                      }
                    ]
                  },
                  "release_channel": {
                    "$id": "urn:pai:shared:release-channel:v1",
                    "anyOf": [
                      {
                        "const": "stable",
                        "type": "string"
                      },
                      {
                        "const": "canary",
                        "type": "string"
                      }
                    ]
                  },
                  "owner_agent_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "expected_catalog_version": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "catalog_as_of": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "policy_input_ref": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "policy_input_hash": {
                    "pattern": "^sha256:[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "skills": {
                    "minItems": 1,
                    "maxItems": 512,
                    "type": "array",
                    "items": {
                      "additionalProperties": false,
                      "type": "object",
                      "required": [
                        "name",
                        "version_constraint",
                        "required"
                      ],
                      "properties": {
                        "name": {
                          "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                          "maxLength": 64,
                          "type": "string"
                        },
                        "version_constraint": {
                          "const": "catalog_revision",
                          "type": "string"
                        },
                        "required": {
                          "type": "boolean"
                        }
                      }
                    }
                  },
                  "idempotency_key": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "trace_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Canonical Skill Registry response",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "type": "object",
                  "required": [
                    "code",
                    "message",
                    "retryable",
                    "details",
                    "trace_id"
                  ],
                  "properties": {
                    "code": {
                      "const": "skill_resolution_succeeded",
                      "type": "string"
                    },
                    "message": {
                      "minLength": 1,
                      "maxLength": 4096,
                      "type": "string"
                    },
                    "retryable": {
                      "const": false,
                      "type": "boolean"
                    },
                    "details": {
                      "additionalProperties": false,
                      "type": "object",
                      "required": [
                        "schema_version",
                        "resolution_attempt_id",
                        "runtime_run_id",
                        "start_attempt_no",
                        "workspace_id",
                        "bot_id",
                        "deployment_environment",
                        "release_channel",
                        "owner_agent_id",
                        "requested_catalog_version",
                        "effective_catalog_version",
                        "catalog_as_of",
                        "security_revocation_epoch",
                        "policy_input_hash",
                        "valid_until",
                        "resolved_skills",
                        "degradation_notes",
                        "duplicate_replayed"
                      ],
                      "properties": {
                        "schema_version": {
                          "const": "skill_resolution_response.v1",
                          "type": "string"
                        },
                        "resolution_attempt_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "runtime_run_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "start_attempt_no": {
                          "minimum": 1,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        "workspace_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "bot_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "deployment_environment": {
                          "$id": "urn:pai:shared:deployment-environment:v1",
                          "anyOf": [
                            {
                              "const": "local",
                              "type": "string"
                            },
                            {
                              "const": "dev",
                              "type": "string"
                            },
                            {
                              "const": "staging",
                              "type": "string"
                            },
                            {
                              "const": "prod",
                              "type": "string"
                            }
                          ]
                        },
                        "release_channel": {
                          "$id": "urn:pai:shared:release-channel:v1",
                          "anyOf": [
                            {
                              "const": "stable",
                              "type": "string"
                            },
                            {
                              "const": "canary",
                              "type": "string"
                            }
                          ]
                        },
                        "owner_agent_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "requested_catalog_version": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "effective_catalog_version": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "catalog_as_of": {
                          "format": "date-time",
                          "type": "string"
                        },
                        "security_revocation_epoch": {
                          "minimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        "policy_input_hash": {
                          "pattern": "^sha256:[0-9a-f]{64}$",
                          "type": "string"
                        },
                        "valid_until": {
                          "format": "date-time",
                          "type": "string"
                        },
                        "resolved_skills": {
                          "maxItems": 512,
                          "type": "array",
                          "items": {
                            "additionalProperties": false,
                            "type": "object",
                            "required": [
                              "resolution_id",
                              "skill_id",
                              "skill_key",
                              "version_id",
                              "version",
                              "package_digest",
                              "manifest_digest",
                              "runtime_target",
                              "granted_capability_refs",
                              "required",
                              "valid_until"
                            ],
                            "properties": {
                              "resolution_id": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "skill_id": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "skill_key": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "version_id": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "version": {
                                "minLength": 1,
                                "maxLength": 128,
                                "type": "string"
                              },
                              "package_digest": {
                                "pattern": "^sha256:[0-9a-f]{64}$",
                                "type": "string"
                              },
                              "manifest_digest": {
                                "pattern": "^sha256:[0-9a-f]{64}$",
                                "type": "string"
                              },
                              "runtime_target": {
                                "const": "filesystem_bundle.v1",
                                "type": "string"
                              },
                              "granted_capability_refs": {
                                "maxItems": 1024,
                                "type": "array",
                                "items": {
                                  "minLength": 1,
                                  "maxLength": 256,
                                  "type": "string"
                                }
                              },
                              "required": {
                                "type": "boolean"
                              },
                              "valid_until": {
                                "format": "date-time",
                                "type": "string"
                              }
                            }
                          }
                        },
                        "degradation_notes": {
                          "maxItems": 512,
                          "type": "array",
                          "items": {
                            "additionalProperties": false,
                            "type": "object",
                            "required": [
                              "skill_key",
                              "reason"
                            ],
                            "properties": {
                              "skill_key": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "reason": {
                                "anyOf": [
                                  {
                                    "const": "not_found",
                                    "type": "string"
                                  },
                                  {
                                    "const": "activation_disabled",
                                    "type": "string"
                                  },
                                  {
                                    "const": "permission_denied",
                                    "type": "string"
                                  },
                                  {
                                    "const": "version_revoked",
                                    "type": "string"
                                  }
                                ]
                              }
                            }
                          }
                        },
                        "duplicate_replayed": {
                          "type": "boolean"
                        }
                      }
                    },
                    "trace_id": {
                      "minLength": 1,
                      "maxLength": 512,
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Canonical non-retryable contract error"
          },
          "403": {
            "description": "Authorization scope mismatch"
          },
          "503": {
            "description": "Owner dependency unavailable"
          }
        }
      }
    },
    "/internal/skill-registry/content": {
      "post": {
        "operationId": "authorizeSkillContentV1",
        "security": [
          {
            "PaiWorkloadJwt": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$id": "urn:pai:skill-registry:content-request:v1",
                "additionalProperties": false,
                "type": "object",
                "required": [
                  "schema_version",
                  "resolution_id",
                  "runtime_run_id",
                  "workspace_id",
                  "bot_id",
                  "deployment_environment",
                  "release_channel",
                  "expected_package_digest",
                  "expected_manifest_digest",
                  "security_revocation_epoch",
                  "trace_id"
                ],
                "properties": {
                  "schema_version": {
                    "const": "skill_content_request.v1",
                    "type": "string"
                  },
                  "resolution_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "runtime_run_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "workspace_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "bot_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "deployment_environment": {
                    "$id": "urn:pai:shared:deployment-environment:v1",
                    "anyOf": [
                      {
                        "const": "local",
                        "type": "string"
                      },
                      {
                        "const": "dev",
                        "type": "string"
                      },
                      {
                        "const": "staging",
                        "type": "string"
                      },
                      {
                        "const": "prod",
                        "type": "string"
                      }
                    ]
                  },
                  "release_channel": {
                    "$id": "urn:pai:shared:release-channel:v1",

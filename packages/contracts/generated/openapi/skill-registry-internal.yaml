                  "additionalProperties": false,
                  "type": "object",
                  "required": [
                    "code",
                    "message",
                    "retryable",
                    "details",
                    "trace_id"
                  ],
                  "properties": {
                    "code": {
                      "const": "skill_content_authorized",
                      "type": "string"
                    },
                    "message": {
                      "minLength": 1,
                      "maxLength": 4096,
                      "type": "string"
                    },
                    "retryable": {
                      "const": false,
                      "type": "boolean"
                    },
                    "details": {
                      "additionalProperties": false,

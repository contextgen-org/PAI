                        },
                        "manifest_digest": {
                          "pattern": "^sha256:[0-9a-f]{64}$",
                          "type": "string"
                        },
                        "entrypoint": {
                          "const": "SKILL.md",
                          "type": "string"
                        },
                        "expires_at": {
                          "format": "date-time",
                          "type": "string"
                        },
                        "runtime_target": {
                          "const": "filesystem_bundle.v1",
                          "type": "string"
                        }
                      }
                    },
                    "trace_id": {
                      "minLength": 1,
                      "maxLength": 512,
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Canonical non-retryable contract error"
          },
          "403": {
            "description": "Authorization scope mismatch"
          },
          "503": {
            "description": "Owner dependency unavailable"
          }
        }
      }
    },
    "/internal/skill-registry/skills/validate": {
      "post": {
        "operationId": "validateSkillPackageV1",
        "security": [
          {
            "PaiWorkloadJwt": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$id": "urn:pai:skill-registry:validate-request:v1",
                "additionalProperties": false,
                "type": "object",
                "required": [
                  "schema_version",
                  "artifact_ref",
                  "content_digest",
                  "media_type",
                  "size_bytes",
                  "idempotency_key",
                  "trace_id"
                ],
                "properties": {
                  "schema_version": {
                    "const": "skill_validate_request.v1",
                    "type": "string"
                  },
                  "artifact_ref": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "content_digest": {
                    "pattern": "^sha256:[0-9a-f]{64}$",
                    "type": "string"
                  },
                  "media_type": {
                    "minLength": 1,
                    "maxLength": 256,
                    "type": "string"
                  },
                  "size_bytes": {
                    "minimum": 0,
                    "maximum": 31457280,
                    "type": "integer"
                  },
                  "idempotency_key": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  },
                  "trace_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Canonical Skill Registry response",
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "type": "object",
                  "required": [
                    "code",
                    "message",
                    "retryable",
                    "details",
                    "trace_id"
                  ],
                  "properties": {
                    "code": {
                      "const": "skill_package_validated",
                      "type": "string"
                    },
                    "message": {
                      "minLength": 1,
                      "maxLength": 4096,
                      "type": "string"
                    },
                    "retryable": {
                      "const": false,
                      "type": "boolean"
                    },
                    "details": {
                      "additionalProperties": false,
                      "type": "object",
                      "required": [
                        "validation_id",
                        "package_digest",
                        "manifest_digest",
                        "normalized_manifest",
                        "diagnostics",
                        "expires_at"
                      ],
                      "properties": {
                        "validation_id": {
                          "minLength": 1,
                          "maxLength": 512,
                          "type": "string"
                        },
                        "package_digest": {
                          "pattern": "^sha256:[0-9a-f]{64}$",
                          "type": "string"
                        },
                        "manifest_digest": {
                          "pattern": "^sha256:[0-9a-f]{64}$",
                          "type": "string"
                        },
                        "normalized_manifest": {
                          "additionalProperties": false,
                          "type": "object",
                          "required": [
                            "schema_version",
                            "runtime_target",
                            "files"
                          ],
                          "properties": {
                            "schema_version": {
                              "const": "skill_package_manifest.v1",
                              "type": "string"
                            },
                            "runtime_target": {
                              "const": "filesystem_bundle.v1",
                              "type": "string"
                            },
                            "files": {
                              "minItems": 1,
                              "maxItems": 512,
                              "type": "array",
                              "items": {
                                "additionalProperties": false,
                                "type": "object",
                                "required": [
                                  "path",
                                  "mode",
                                  "size_bytes",
                                  "sha256"
                                ],
                                "properties": {
                                  "path": {
                                    "minLength": 1,
                                    "maxLength": 4096,
                                    "type": "string"
                                  },
                                  "mode": {
                                    "pattern": "^0[0-7]{3}$",
                                    "type": "string"
                                  },
                                  "size_bytes": {
                                    "minimum": 0,
                                    "maximum": 9007199254740991,
                                    "type": "integer"
                                  },
                                  "sha256": {
                                    "pattern": "^sha256:[0-9a-f]{64}$",
                                    "type": "string"
                                  }
                                }
                              }
                            }
                          }
                        },
                        "diagnostics": {
                          "maxItems": 4096,
                          "type": "array",
                          "items": {
                            "additionalProperties": false,
                            "type": "object",
                            "required": [
                              "severity",
                              "code",
                              "path",
                              "message"
                            ],
                            "properties": {
                              "severity": {
                                "anyOf": [
                                  {
                                    "const": "info",
                                    "type": "string"
                                  },
                                  {
                                    "const": "warning",
                                    "type": "string"
                                  },
                                  {
                                    "const": "error",
                                    "type": "string"
                                  }
                                ]
                              },
                              "code": {
                                "minLength": 1,
                                "maxLength": 512,
                                "type": "string"
                              },
                              "path": {
                                "maxLength": 4096,
                                "type": "string"
                              },
                              "message": {
                                "minLength": 1,
                                "maxLength": 4096,
                                "type": "string"
                              }
                            }
                          }
                        },
                        "expires_at": {
                          "format": "date-time",
                          "type": "string"
                        }
                      }
                    },
                    "trace_id": {
                      "minLength": 1,
                      "maxLength": 512,
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Canonical non-retryable contract error"
          },
          "403": {
            "description": "Authorization scope mismatch"
          },
          "503": {
            "description": "Owner dependency unavailable"
          }
        }
      }
    },
    "/internal/skill-registry/skills/{name}/versions": {
      "post": {
        "operationId": "publishSkillVersionV1",
        "security": [
          {
            "PaiWorkloadJwt": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$id": "urn:pai:skill-registry:publish-request:v1",
                "additionalProperties": false,
                "type": "object",
                "required": [
                  "schema_version",
                  "skill_name",
                  "semver",
                  "validation_id",
                  "package_digest",
                  "manifest_digest",
                  "artifact_ref",
                  "idempotency_key",
                  "trace_id"
                ],
                "properties": {
                  "schema_version": {
                    "const": "skill_publish_request.v1",
                    "type": "string"
                  },
                  "skill_name": {
                    "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                    "maxLength": 64,
                    "type": "string"
                  },
                  "semver": {
                    "pattern": "^(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$",
                    "maxLength": 128,
                    "type": "string"
                  },
                  "validation_id": {
                    "minLength": 1,
                    "maxLength": 512,
                    "type": "string"
